server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Preserve links to pages renamed in this version.
    location = /about.html { return 302 /entreprise.html; }
    location = /about { return 302 /entreprise.html; }
    location = /finance-erp.html { return 302 "/solutions.html#continuity"; }
    location = /finance-erp { return 302 "/solutions.html#continuity"; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # Revalidate filenames that remain the same between releases.
    location ~* \.(?:css|js|png|webp|svg)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
